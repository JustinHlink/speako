name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Throwaway key for CI only. GEMINI_API_KEY stays empty so no test can reach the live provider.
  DJANGO_SECRET_KEY: ci-only-not-secret
  GEMINI_API_KEY: ''
  PYTHONUNBUFFERED: '1'

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Backend tests
        run: python manage.py test practice

      - name: Frontend tests
        run: |
          status=0
          for f in practice/tests*.cjs; do
            echo "::group::$f"
            node "$f" || status=1
            echo "::endgroup::"
          done
          exit $status
